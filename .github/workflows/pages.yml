name: Pages

on:
  push:
    branches: [claude/skill-plugin-install-zwbrr7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.ablage.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: ablage
        uses: actions/deploy-pages@v4
